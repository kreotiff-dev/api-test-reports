name: Run WMS smoke Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Newman and Allure
        run: |
          npm install -g newman newman-reporter-allure allure-commandline

      - name: Run Newman tests
        run: |
          newman run collections/WMS-smoke.json -e environments/env-wms.json -r cli,allure --reporter-allure-export allure-results || true

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Publish report to GitHub Pages
        run: |
          export REPORT_TYPE=smoke
          export REPORT_DIR=reports/$REPORT_TYPE/$(date +'%Y-%m-%d_%H-%M-%S')

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || echo "No gh-pages yet"
          git switch gh-pages || git checkout --orphan gh-pages

          mkdir -p $REPORT_DIR
          cp -r allure-report/* $REPORT_DIR/
          touch .nojekyll

          # Добавим запись об отчёте в index.json
          mkdir -p reports
          if [ -f reports/index.json ]; then
            tail -n +2 reports/index.json | sed '$ d' > tmp.json || true
            echo "," >> tmp.json
          else
            echo "[" > tmp.json
          fi
          echo "{\"type\": \"$REPORT_TYPE\", \"date\": \"$(basename $REPORT_DIR)\", \"url\": \"$REPORT_DIR/index.html\"}" >> tmp.json
          echo "]" >> tmp.json
          mv tmp.json reports/index.json

          git add .
          git commit -m "Publish $REPORT_TYPE report: $REPORT_DIR"
          git push origin gh-pages
