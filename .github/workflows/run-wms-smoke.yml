name: Run WMS Smoke Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Newman and Allure
        run: |
          npm install -g newman newman-reporter-allure allure-commandline

      - name: Generate timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Run Newman smoke tests
        run: |
          newman run collections/WMS-smoke.json -e environments/env-wms.json -r cli,allure --reporter-allure-export allure-results || true

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Publish smoke report and update index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || echo "no gh-pages yet"
          git switch gh-pages || git checkout --orphan gh-pages

          REPORT_DIR="reports/smoke/${{ steps.timestamp.outputs.ts }}"
          mkdir -p "$REPORT_DIR"
          cp -r allure-report/* "$REPORT_DIR/"
          touch .nojekyll

          INDEX_FILE="reports/index.json"
          REPORT_INFO="{\"type\": \"smoke\", \"date\": \"${{ steps.timestamp.outputs.ts }}\", \"url\": \"$REPORT_DIR/index.html\"}"

          if [ -f "$INDEX_FILE" ]; then
            CONTENT=$(cat "$INDEX_FILE" | jq .)
          else
            CONTENT="[]"
          fi

          UPDATED=$(echo "$CONTENT" | jq "[ $REPORT_INFO ] + . | .[:10]")
          echo "$UPDATED" > "$INDEX_FILE"

          git add .
          git commit -m "Publish smoke report at $REPORT_DIR"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
