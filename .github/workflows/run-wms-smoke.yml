name: Run WMS smoke Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Newman and Allure
        run: |
          npm install -g newman newman-reporter-allure allure-commandline

      - name: Run Newman tests
        run: |
          newman run collections/WMS-smoke.json -e environments/env-wms.json -r cli,allure --reporter-allure-export allure-results || true

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Publish report to gh-pages
        run: |
          export REPORT_TYPE=smoke
          export REPORT_DATE=$(date +'%Y-%m-%d_%H-%M-%S')
          export REPORT_DIR=reports/$REPORT_TYPE/$REPORT_DATE

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || echo "No gh-pages yet"
          git switch gh-pages || git checkout --orphan gh-pages

          mkdir -p $REPORT_DIR
          cp -r allure-report/* $REPORT_DIR/

          # Обновим index.json
          INDEX_FILE=index.json
          TMP_FILE=index_tmp.json
          echo "[{\"type\": \"$REPORT_TYPE\", \"date\": \"$REPORT_DATE\", \"url\": \"$REPORT_DIR/index.html\"}]" > $TMP_FILE
          if [ -f $INDEX_FILE ]; then
            jq -s '.[0] + .[1]' $TMP_FILE $INDEX_FILE | jq 'sort_by(.date) | reverse | .[:10]' > $INDEX_FILE
          else
            mv $TMP_FILE $INDEX_FILE
          fi

          rm -f $TMP_FILE

          touch .nojekyll
          git add .
          git commit -m "Publish $REPORT_TYPE report: $REPORT_DIR"
          git push origin gh-pages

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
