name: Run WMS Smoke Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Newman and Allure
        run: |
          npm install -g newman newman-reporter-allure allure-commandline

      - name: Run Newman tests
        run: |
          newman run collections/WMS-smoke.json -e environments/env-wms.json -r cli,allure --reporter-allure-export allure-results || true

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Publish report to GitHub Pages
        run: |
          export REPORT_TYPE=smoke
          export REPORT_DIR=reports/$REPORT_TYPE/$(date +'%Y-%m-%d_%H-%M-%S')

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || echo "No gh-pages yet"
          git switch gh-pages || git checkout --orphan gh-pages

          mkdir -p $REPORT_DIR
          cp -r allure-report/* $REPORT_DIR/
          touch .nojekyll

          # Определим статус
          if grep -q '"status":"failed"' allure-results/widgets/summary.json; then
            STATUS=failed
          else
            STATUS=passed
          fi

          # Обновим index.json корректно
          mkdir -p reports
          TMP_FILE=$(mktemp)
          if [ -f reports/index.json ]; then
            jq ". + [{\"type\": \"$REPORT_TYPE\", \"date\": \"$(basename $REPORT_DIR)\", \"url\": \"$REPORT_DIR/index.html\", \"status\": \"$STATUS\"}]" reports/index.json > "$TMP_FILE"
          else
            echo "[{\"type\": \"$REPORT_TYPE\", \"date\": \"$(basename $REPORT_DIR)\", \"url\": \"$REPORT_DIR/index.html\", \"status\": \"$STATUS\"}]" > "$TMP_FILE"
          fi
          mv "$TMP_FILE" reports/index.json

          git add .
          git commit -m "Publish $REPORT_TYPE report: $REPORT_DIR"
          git pull --rebase origin gh-pages || true
          git push origin gh-pages
