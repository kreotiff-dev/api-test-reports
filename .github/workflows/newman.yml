name: Run Newman (artifact only)

on:
  schedule:
    - cron: '0 3 * * *'   # каждый день 03:00 UTC
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: |
          npm i -g newman newman-reporter-htmlextra
          mkdir -p reports

      - name: Run Newman
        # сохраняем отчёт даже если есть фейлы
        run: |
          newman run collections/WMS-smoke.json \
            -e environment/env-wms.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/report.html || true

      - name: Upload HTML report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: reports/report.html
