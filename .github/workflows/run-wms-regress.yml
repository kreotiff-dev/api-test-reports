name: Run WMS Regress Tests

on:
  schedule:
      - cron: '0 0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Newman and Allure
        run: |
          npm install -g newman newman-reporter-allure allure-commandline

      - name: Run Newman tests
        run: |
          newman run collections/WMS-regress.json -e environments/env-wms.json -r cli,allure --reporter-allure-export allure-results || true

      - name: Generate Allure report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Publish report to GitHub Pages
        run: |
          export REPORT_TYPE=regress
          export REPORT_DIR=reports/$REPORT_TYPE/$(date +'%Y-%m-%d_%H-%M-%S')

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || echo "No gh-pages yet"
          git switch gh-pages || git checkout --orphan gh-pages

          mkdir -p $REPORT_DIR
          cp -r allure-report/* $REPORT_DIR/
          touch .nojekyll

          # Добавим запись об отчёте в index.json
          mkdir -p reports

          STATUS="unknown"
          if [ -f allure-report/widgets/summary.json ]; then
            STATUS=$(jq -r '.statistic.failures == 0 and .statistic.broken == 0 | if . then "passed" else "failed" end' allure-report/widgets/summary.json)
          fi

          NEW_RECORD=$(jq -n \
            --arg type "$REPORT_TYPE" \
            --arg date "$(basename $REPORT_DIR)" \
            --arg url "$REPORT_DIR/index.html" \
            --arg status "$STATUS" \
            '{type: $type, date: $date, url: $url, status: $status}')

          if [ -f reports/index.json ] && jq empty reports/index.json 2>/dev/null; then
            jq ". + [ $NEW_RECORD ]" reports/index.json > tmp.json && mv tmp.json reports/index.json
          else
            echo "[ $NEW_RECORD ]" > reports/index.json
          fi

          git add .
          git commit -m "Publish $REPORT_TYPE report: $REPORT_DIR"
          git push origin gh-pages
