<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Test Reports</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #ff6600;
    }
    h2 {
      margin-top: 40px;
    }
    .report-list {
      margin-top: 10px;
      padding-left: 20px;
    }
    .report-item {
      margin-bottom: 8px;
    }
    .report-link {
      color: #0066cc;
      text-decoration: none;
    }
    .report-link:hover {
      text-decoration: underline;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>API Test Reports</h1>
  <h2>Последние отчёты</h2>
  <div id="reports" class="report-list">Загрузка...</div>

  <script>
    fetch('reports/index.json')
      .then(response => {
        if (!response.ok) throw new Error("Ошибка загрузки index.json");
        return response.json();
      })
      .then(data => {
        const container = document.getElementById("reports");
        container.innerHTML = "";
        if (data.length === 0) {
          container.innerText = "Пока нет отчётов.";
          return;
        }

        data.forEach(report => {
          const link = document.createElement("a");
          link.href = report.url;
          link.innerText = `${report.type.toUpperCase()} – ${report.date}`;
          link.className = "report-link";

          const div = document.createElement("div");
          div.className = "report-item";
          div.appendChild(link);
          container.appendChild(div);
        });
      })
      .catch(err => {
        document.getElementById("reports").innerHTML = '<span class="error">Ошибка загрузки отчётов.</span>';
        console.error(err);
      });
  </script>
</body>
</html>
