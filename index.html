<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Test Reports</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #ff6600;
    }
    h2 {
      margin-top: 40px;
    }
    .report-list {
      margin-top: 10px;
      padding-left: 20px;
    }
    .report-item {
      margin-bottom: 8px;
    }
    .report-link {
      color: #0066cc;
      text-decoration: none;
    }
    .report-link:hover {
      text-decoration: underline;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>API Test Reports</h1>
  <h2>Последние отчёты</h2>
  <div id="reports" class="report-list">Загрузка...</div>

  <script>
  fetch('reports/index.json')
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('reports');
      data.reverse().slice(0, 10).forEach(report => {
        const li = document.createElement('li');

        const statusIcon = document.createElement('span');
        statusIcon.textContent = report.status === 'passed' ? '🟢' : '🔴';
        statusIcon.style.marginRight = '8px';

        const link = document.createElement('a');
        link.href = report.url;
        link.textContent = `${report.type.toUpperCase()} – ${report.date}`;

        li.appendChild(statusIcon);
        li.appendChild(link);
        container.appendChild(li);
      });
    })
    .catch(error => {
      document.getElementById('reports').innerHTML = '<li>Ошибка загрузки отчётов.</li>';
      console.error('Error:', error);
    });
</script>
</body>
</html>
