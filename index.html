<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Test Reports</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      background: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #ff6f00;
    }
    button {
      background: #ff6f00;
      color: white;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 5px;
      margin: 0.5rem 1rem 2rem 0;
      cursor: pointer;
      font-size: 1rem;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      margin-bottom: 0.5rem;
      padding: 0.5rem;
      background: white;
      border-left: 5px solid green;
    }
    li.fail {
      border-left-color: red;
    }
    a {
      text-decoration: none;
      color: #0077cc;
    }
  </style>
</head>
<body>
  <h1>API Test Reports</h1>

  <button onclick="runTest('smoke')">Запустить Smoke-тесты</button>
  <button onclick="runTest('regress')">Запустить Regress-тесты</button>

  <h2>Последние отчёты</h2>
  <ul id="report-list">
    <!-- Автоматически будет заполнено -->
  </ul>

  <script>
    function runTest(type) {
      alert("Будет запущен прогон: " + type);
      // Здесь можно использовать GitHub API или webhook
    }

    async function fetchReports() {
      const response = await fetch('reports/index.json');
      if (!response.ok) {
        document.getElementById("report-list").innerHTML = '<li>Ошибка загрузки отчётов.</li>';
        return;
      }
      const data = await response.json();
      const list = document.getElementById("report-list");
      list.innerHTML = '';
      data.slice(0, 10).forEach(r => {
        const li = document.createElement('li');
        li.className = r.status.toLowerCase() === 'fail' ? 'fail' : '';
        li.innerHTML = `<a href="reports/${r.type}/${r.path}/index.html">${r.type.toUpperCase()} — ${r.date}</a> (${r.status})`;
        list.appendChild(li);
      });
    }

    fetchReports();
  </script>
</body>
</html>
