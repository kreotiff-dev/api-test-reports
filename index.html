<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>API Test Reports</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
    }
    h1 {
      color: darkorange;
    }
    .buttons {
      margin-bottom: 20px;
    }
    .btn {
      background-color: orange;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-right: 10px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
      text-decoration: none;
    }
    .btn:hover {
      background-color: darkorange;
    }
    .section-title {
      font-size: 20px;
      margin-bottom: 10px;
    }
    #reports {
      background-color: white;
      padding: 10px;
      border-left: 4px solid green;
    }
  </style>
</head>
<body>

  <h1>API Test Reports</h1>

  <div class="buttons">
    <a class="btn" href="https://github.com/kreotiff-dev/api-test-reports/actions/workflows/smoke.yml" target="_blank">Запустить Smoke-тесты</a>
    <a class="btn" href="https://github.com/kreotiff-dev/api-test-reports/actions/workflows/regress.yml" target="_blank">Запустить Regress-тесты</a>
  </div>

  <div class="section-title">Последние отчёты</div>
  <div id="reports">Загрузка...</div>

  <script>
    async function loadReports() {
      try {
        const response = await fetch('./reports.json');
        const data = await response.json();
        const list = data.map(report =>
          `<div><a href="${report.url}" target="_blank">${report.name}</a> — <strong>${report.status}</strong></div>`
        ).join('');
        document.getElementById('reports').innerHTML = list;
      } catch (err) {
        document.getElementById('reports').innerText = 'Ошибка загрузки отчётов.';
      }
    }
    loadReports();
  </script>
</body>
</html>
