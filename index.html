<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Test Reports</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #ff6600;
    }
    .history {
      margin-top: 40px;
    }
    .report-list {
      list-style-type: none;
      padding: 0;
    }
    .report-list li {
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    .report-list a {
      text-decoration: none;
      color: #007acc;
    }
    .report-list .status-pass {
      color: green;
    }
    .report-list .status-fail {
      color: red;
    }
  </style>
</head>
<body>
  <h1>API Test Reports</h1>

  <div class="history">
    <h2>Последние отчёты</h2>
    <ul class="report-list" id="reportList">
      <li>Загрузка отчётов...</li>
    </ul>
  </div>

  <script>
    async function loadReports() {
      try {
        const response = await fetch('reports/history.json');
        const data = await response.json();

        const list = document.getElementById('reportList');
        list.innerHTML = '';

        data.slice(0, 10).forEach(report => {
          const li = document.createElement('li');
          const statusClass = report.status === 'pass' ? 'status-pass' : 'status-fail';
          li.innerHTML = `<a href="${report.link}" target="_blank">${report.date} — <span class="${statusClass}">${report.status}</span></a>`;
          list.appendChild(li);
        });
      } catch (e) {
        document.getElementById('reportList').innerHTML = '<li>Ошибка загрузки отчётов.</li>';
      }
    }

    loadReports();
  </script>
</body>
</html>
